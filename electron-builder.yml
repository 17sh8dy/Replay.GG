appId: gg.replay.app
productName: Replay.gg
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Tray icon is read at runtime from the packaged app.
  - assets/logo/png/replay-gg-icon-*.png

# Ships a bundled ffmpeg when one is dropped here; the app falls back to PATH.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

win:
  icon: assets/logo/png/replay-gg.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
