appId: gg.replay.app
productName: Replay.gg
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

# Ships a bundled ffmpeg when one is dropped here; the app falls back to PATH.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
