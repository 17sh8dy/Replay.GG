appId: gg.replay.app
productName: Replay.gg
directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Tray icon is read at runtime from the packaged app.
  - assets/logo/png/replay-gg-icon-*.png

# Ships a bundled ffmpeg when one is dropped here; the app falls back to PATH.
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

# Updates: the app reads latest.yml from the newest GitHub release of this repo. Publish a release
# by uploading the installer and latest.yml (and the .blockmap) that `npm run dist` writes to release/.
publish:
  provider: github
  owner: 17sh8dy
  repo: Replay.GG

win:
  icon: assets/logo/png/replay-gg.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
